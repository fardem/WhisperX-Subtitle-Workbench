name: Release

# Attaches WhisperX-Subtitle-Workbench.zip to the release of a tag (e.g. 0.8.0). install.bat and the
# download link of the README take this file; the tag must be the version of wt_version.py.
on:
  release:
    types: [published]
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and version match
        run: test "$(python3 -c 'import wt_version; print(wt_version.VERSION)')" = "$GITHUB_REF_NAME"
      - name: Build the ZIP
        run: git archive --format=zip --prefix=WhisperX-Subtitle-Workbench/ -o WhisperX-Subtitle-Workbench.zip HEAD
      - name: Create the release if needed and attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Changes: see CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" WhisperX-Subtitle-Workbench.zip --clobber
