; ==============================================================================
;  WhisperX Subtitle Workbench - settings template
; ==============================================================================
;  On the first start this file is copied to whisper_tool.ini - your own settings
;  live there, so updates never overwrite them. Most values can also be changed
;  in the window (Settings ...), which writes only the changed values and keeps
;  all comments.
;
;  Rules for this file:
;   - comments always on their own line (starting with ; or #), never after a value
;   - spaces around "=" are allowed
;   - long values may span several lines: indent the continuation lines
;   - key names are case-insensitive
;   - language-specific sections exist for de, en, ar, tr
; ==============================================================================

[System]
; Path to ffmpeg (reads and filters the audio directly into memory).
; "ffmpeg" = take it from PATH, or a full path such as C:\ffmpeg\bin\ffmpeg.exe
ffmpeg_path = ffmpeg
; cuda = NVIDIA graphics card, cpu = processor (fallback only, very slow)
device = cuda
; Language of the interface, the log and the comparison report:
; auto (= Windows language, otherwise English), de, en, tr - or any lang/<code>.json
ui_language = auto

[Menu]
; Seconds until the automatic start when files are dropped onto Whisper_Tool.bat (0 = never)
timeout = 15
; 1 = start immediately with the defaults below, without countdown
skip = 0
; Defaults of the main window (also saved there with "Save as default"):
;   ffmpeg:   1 = audio filter on, 0 = original audio
;   language: auto, de, en, ar, tr
;   mode:     sentence, word, raw
ffmpeg   = 0
language = auto
mode     = sentence
; Prompt preselection: ini (per language from [Prompt]), custom (own text), none
prompt_mode   = ini
custom_prompt =
; Show recognized lines live in the log during transcription (1 = yes)
live_lines = 1

[Whisper]
; Model: large-v3, large-v2, large-v3-turbo, a Hugging Face repo (owner/name)
; or the path to a CTranslate2 model folder
model = large-v3
; Optionally a different model per language (remove the ; at the start of the line):
; model.tr = C:\WhisperX-Subtitle-Workbench\models\whisper-large-v3-tr
; Beam search width: WhisperX default 5, above ~10 hardly any gain, higher = much slower
beam_size = 5
; float16 = fast, practically the same accuracy as float32 (full precision, slower)
compute_type = float16
; Batch size ONLY affects speed, not the result (WhisperX decodes every chunk
; independently). 8-16 is reasonable with 12-16 GB of graphics memory
batch_size = 8
; Write numbers as words ("sixth of November" instead of "6 November")
; Advantage: every number gets exact timestamps. Disadvantage: no digits in the subtitle
; 0 = off, 1 = on
suppress_numerals = 0

[VAD]
; Voice activity detection: which parts of the recording are speech at all
; method: pyannote (default) or silero
method = pyannote
; Thresholds: lower = more sensitive (more speech detected, but also more noise)
; WhisperX default: onset 0.500 / offset 0.363 - for speeches with background
; noise 0.4 / 0.323 often works better
onset  = 0.500
offset = 0.363
; Maximum length of a chunk in seconds (matters mostly in raw mode)
chunk_size = 30

[Audio]
; FFmpeg audio filter: frequency cleanup + noise reduction + loudness normalization
; Note: a lowpass above 8000 Hz has practically no effect on 16 kHz audio
filter_string = highpass=f=100,lowpass=f=8200,afftdn,dynaudnorm=f=150:g=15:p=1.0:m=10.0

[Output]
; Also save the WhisperX result as <name>.json (1 = yes) - the SRT can then be
; rebuilt later without a new transcription
keep_json = 0
; File suffixes: speech subtitles, lyrics input, lyrics subtitles
; Placeholders in speech_suffix: {model} = model used, {lang} = language
; (e.g. .{model}.srt gives every model its own SRT - handy for comparing)
speech_suffix = .srt
lyrics_input  = .lyric.txt
lyrics_suffix = .lyric.srt
; utf-8 (default) or utf-8-sig if a player shows special characters wrongly
encoding = utf-8

[Layout]
; Defaults for sentence mode: characters per line, lines per subtitle
default_chars = 42
default_lines = 2
; Orphan rule:
;   orphan_limit:    words up to X characters move to the next subtitle after a comma
;   orphan_min_fill: but only if the line is already X percent full
orphan_limit    = 4
orphan_min_fill = 80
; Pause rules (seconds, 0 = off):
;   split_pause:  a speech pause of this length starts a new subtitle (recommended 1.5)
;   max_duration: no subtitle stays longer than this (recommended 7)
split_pause  = 1.5
max_duration = 7
; Reading time - sentence mode only (word by word and raw stay exactly as spoken).
; Only the END of a subtitle moves into the pause after it - never into the next
; subtitle, never beyond max_duration. Start and text stay unchanged.
;   min_duration: a subtitle stays at least this long (seconds, 0 = off, recommended 1)
;   max_cps:      max. reading speed in characters per second (0 = off, recommended 17).
;                 Slower subtitles are extended; if there is no pause for that, the log
;                 lists them so you can shorten the text in Subtitle Edit.
min_duration = 1
max_cps      = 17
; Line balancing - sentence mode only: spread the words of a subtitle evenly over
; its lines instead of filling the first line to the limit
; ("we did not / see that coming"  instead of  "we did not see that / coming").
; Prefers a break after a comma, avoids an article/preposition at the end of a
; line. Same words, same number of lines - the times do not change. 1 = on
balance_lines = 1

[Lyrics]
; Extend the end of a line by up to X seconds, at most until just before the next line
; 0 = off, recommended 1-1.5
line_hold = 1
; Minimum gap to the next line in seconds
line_gap  = 0.05

[Gaps]
; Gap check: after the transcription, find loud, voice-like passages without text
; (e.g. quiet speech swallowed by speech detection). 1 = on
enabled = 1
; only report gaps of at least this length (seconds)
min_length = 1.0
; how clearly above the noise floor a passage must be (dB) - smaller = more sensitive
margin_db = 8
; also save the findings as a subtitle file to jump to (VLC / Subtitle Edit)
write_srt = 1


; ==============================================================================
;  LANGUAGE-SPECIFIC SETTINGS
;  With language "auto" the language is detected per file and the matching
;  entry is used. If it is missing: no prompt / no fillers / no rule.
; ==============================================================================

[Prompt]
; Short prompt per language - ideally a sentence about the content plus rare
; names and terms in the desired spelling. Important: the prompt must be in the
; language of the audio, otherwise Whisper may start translating.
de = Transkript einer Rede auf Deutsch.
en = Transcript of a speech in English.
tr = Türkçe bir konuşmanın dökümü.
ar = تفريغ نصي لخطاب باللغة العربية.

[Filler]
; Filler words that are removed (comma-separated)
de = ähm, öh, hmm, äh, tja
en = um, uh, uhm, erm, hmm
tr = ııı, ıı, eee, hmm
; Arabic: typical fillers like "يعني" are also normal words - therefore empty
ar =

[Dangling]
; Articles/prepositions that would hang alone at the end of a subtitle move to the
; next one. Words with punctuation ("I agree to.") are never moved.
de = der, die, das, den, dem, ein, eine, einer, eines, einem, einen, des, zur, zum, beim,
     vom, am, im, ans, ins, auf, an, in, für, durch, nach, mit, über, unter, vor, hinter,
     neben, zwischen, zu
en = the, a, an, of, to, in, on, at, for, with, from, by, into
; Turkish appends suffixes instead of using prepositions - hardly needed
tr = bir
ar = في, من, على, إلى, عن, مع

[Replacements]
; For ALL languages. Fix recurring misrecognitions:  Recognized = Correct
; Only whole words/phrases are replaced, case-insensitive. Example:
; Open AI = OpenAI

[Replacements.de]

[Replacements.en]

[Replacements.tr]

[Replacements.ar]
