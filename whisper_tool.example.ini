; ==============================================================================
;  WhisperX Subtitle Workbench - settings template
; ==============================================================================
;  The first start copies this file to whisper_tool.ini; updates do not touch it.
;  Settings ... in the window writes only changed values and keeps all comments.
;
;  Comments stand on their own line (; or #), never after a value. Spaces around
;  "=" are allowed, key names are case-insensitive. A long value may continue on
;  indented lines. Language sections exist for de, en, ar, tr.
; ==============================================================================

[System]
; ffmpeg_path: "ffmpeg" takes it from PATH, otherwise a full path (C:\ffmpeg\bin\ffmpeg.exe).
ffmpeg_path = ffmpeg
; device: cuda = NVIDIA graphics card, cpu = processor (very slow).
device = cuda
; ui_language: interface, log and comparison report. auto = Windows language, otherwise
; English; de, en, tr or any other lang/<code>.json.
ui_language = auto

[Menu]
; timeout: seconds until the automatic start after dropping files onto Whisper_Tool.bat. 0 = never.
timeout = 15
; skip: 1 = start at once with the defaults below, without countdown.
skip = 0
; Defaults of the main window, also saved there with "Save as default".
; ffmpeg: 1 = audio filter on, 0 = original audio. language: auto, de, en, ar, tr.
; mode: sentence, word, raw.
ffmpeg   = 0
language = auto
mode     = sentence
; prompt_mode: ini (per language from [Prompt]), custom (custom_prompt) or none.
prompt_mode   = ini
custom_prompt =
; live_lines: 1 = show recognized lines in the log during the transcription.
live_lines = 1

[Whisper]
; model: large-v3, large-v2, large-v3-turbo, a Hugging Face repo (owner/name) or the path
; to a CTranslate2 model folder.
model = large-v3
; Own model per language (remove the ;): model.<lang>, optional compute_type.<lang>,
; use_prompt.<lang> = 0 for no prompt, use_model.<lang> = 0 for the default model (entries stay).
; model.tr = C:\WhisperX-Subtitle-Workbench\models\whisper-large-v3-tr
; use_model.tr = 0

; beam_size: WhisperX default 5. Above about 10 hardly any gain, but much slower.
beam_size = 5
; compute_type: float16 is fast with practically the accuracy of float32. bfloat16 needs
; RTX 30xx or newer, otherwise float16 is used. Also float32, int8_float16, int8.
compute_type = float16
; batch_size: affects only the speed, not the result. 8-16 with 12-16 GB of graphics memory.
batch_size = 8
; suppress_numerals: 1 = numbers as words ("sixth of November"). Every number gets exact
; timestamps, but the subtitle has no digits.
suppress_numerals = 0

[VAD]
; Voice activity detection: which parts of the recording are speech.
; method: pyannote (default) or silero.
method = pyannote
; Lower = more speech detected, but also more noise. WhisperX default 0.500 / 0.363;
; with background noise 0.4 / 0.323 often works better.
onset  = 0.500
offset = 0.363
; chunk_size: maximum length of a chunk in seconds; matters mostly in raw mode.
chunk_size = 30

[Audio]
; filter_string: FFmpeg filter before the transcription of speech. A lowpass above
; 8000 Hz has practically no effect on 16 kHz audio.
filter_string = highpass=f=100,lowpass=f=8200,afftdn,dynaudnorm=f=150:g=15:p=1.0:m=10.0

[Output]
; keep_json: 1 = also save <name>.json; the SRT can be rebuilt from it without a new transcription.
keep_json = 0
; Suffixes of speech subtitles, lyrics text and lyrics subtitles. speech_suffix knows
; {model} and {lang}: .{model}.srt gives every model its own SRT.
speech_suffix = .srt
lyrics_input  = .lyric.txt
lyrics_suffix = .lyric.srt
; encoding: utf-8, or utf-8-sig if a player shows special characters wrongly.
encoding = utf-8

[Layout]
; Characters per line and lines per subtitle in mode "Sentences" (also in the main window).
default_chars = 42
default_lines = 2

; --- 1 · Splitting ("Sentences" only) ---
; max_duration: a subtitle holds at most this many seconds of speech, then a new one begins.
; Not a display time. 0 = off, recommended 7.
max_duration = 7
; A short word after a comma starts the next subtitle: words of at most orphan_limit
; characters (0 = off), only if the line is at least orphan_min_fill percent full.
orphan_limit    = 4
orphan_min_fill = 80
; balance_lines: 1 = spread the words evenly over the lines ("we did not / see that coming"),
; preferably after a comma. The times do not change.
balance_lines = 1

; --- 2 · Pauses ("Sentences", "Word by word", "Raw") ---
; pause: a speech pause longer than this many seconds is a real pause; a new segment
; (word or subtitle) begins there. Recommended 2.
pause      = 2
; smooth: 1 = no flicker (e.g. DaVinci Resolve): after a short pause the segment stays until
; the next one, after a real pause pause_hold seconds more. 0 = it ends with the speech.
smooth     = 1
; pause_hold: shorter than pause. Recommended 1.
pause_hold = 1

[Lyrics]
; --- 3 · Lyrics: own rules for song lines; [Layout] does not apply ---
; line_hold: extend a line by up to this many seconds, at most until the next line.
; 0 = off, recommended 1 to 1.5 (main window: "Lyrics: hold line").
line_hold = 1
; line_gap: seconds to the next line. 0 = seamless, no flicker (e.g. DaVinci Resolve).
line_gap  = 0.05

[Gaps]
; enabled: 1 = after the transcription, report loud, voice-like passages without text.
enabled = 1
; min_length: shortest reported gap in seconds.
min_length = 1.0
; margin_db: dB above the noise floor; smaller = more sensitive.
margin_db = 8
; write_srt: 1 = also save the findings as a subtitle file (VLC, Subtitle Edit).
write_srt = 1

[Score]
; threshold: mark words whose score (0-1, how well the word fits the audio) is below this.
; 0 = off, otherwise 0.05-0.95, recommended 0.4. Higher = more entries; names and foreign
; words are below it more often. The subtitles do not change.
threshold = 0.4
; write_srt: 1 = also save the findings as <name>.unsure.srt (name in the interface language).
write_srt = 1

[Resolve]
; Jobs from the DaVinci Resolve plugin take language, mode, audio filter, characters per line
; and lines from the plugin window, everything else from this file.
; countdown: seconds until such a job starts, independent of [Menu] timeout. 0 = press Start.
countdown = 10
; auto_hand_over: 1 = hand the subtitles over to DaVinci as soon as the job is transcribed.
auto_hand_over = 0
; Check tracks in Resolve: track_gaps = "WhisperX gaps" (needs [Gaps] enabled = 1),
; track_fast = "WhisperX too fast" ("Sentences" only). "WhisperX unsure" follows [Score].
track_gaps = 1
track_fast = 1
; close_after: 1 = close the Workbench after the hand-over, 0 = minimize it (models stay loaded).
close_after = 0
; close_plugin: seconds until the plugin window closes after an import without errors. 0 = stays open.
close_plugin = 10
; close_plugin_warning: 1 = close it also after a warning about the number or position of the subtitles.
close_plugin_warning = 0
; skip_plugin_update: the start does not ask to update the plugin for this version ("No"). Empty = ask.
skip_plugin_update =


; ==============================================================================
;  Language-specific settings
;  With language "auto" the entry of the detected language is used.
;  A missing entry: no prompt, no fillers, no rule.
; ==============================================================================

[Prompt]
; A sentence about the content plus rare names and terms in the desired spelling.
; Write it in the language of the audio, otherwise Whisper may translate.
de = Transkript einer Rede auf Deutsch.
en = Transcript of a speech in English.
tr = Türkçe bir konuşmanın dökümü.
ar = تفريغ نصي لخطاب باللغة العربية.

[Filler]
; Filler words that are removed, comma-separated.
de = ähm, öh, hmm, äh, tja
en = um, uh, uhm, erm, hmm
tr = ııı, ıı, eee, hmm
; Arabic: typical fillers like "يعني" are also normal words, so the list is empty.
ar =

[Dangling]
; Articles and prepositions at the end of a subtitle move to the next one.
; Words with punctuation ("I agree to.") stay.
de = der, die, das, den, dem, ein, eine, einer, eines, einem, einen, des, zur, zum, beim,
     vom, am, im, ans, ins, auf, an, in, für, durch, nach, mit, über, unter, vor, hinter,
     neben, zwischen, zu
en = the, a, an, of, to, in, on, at, for, with, from, by, into
; Turkish uses suffixes instead of prepositions.
tr = bir
ar = في, من, على, إلى, عن, مع

[Abbreviations]
; Abbreviations stay with the next word and never end a sentence ("Dr. Müller"). Write them
; as Whisper does: "z. B." and "z.B." are different words. usw. and etc. are left out: they
; often end a sentence. Empty = none, a missing line = the built-in list (the same as here).
de = Dr., Prof., Dipl.-Ing., Hr., Fr., Nr., St., z. B., z.B., d. h., d.h., u. a.,
     u.a., bzw., ca., ggf., evtl., vgl., inkl., bspw., sog.
en = Mr., Mrs., Ms., Dr., Prof., e.g., i.e., vs., approx.
tr = Dr., Prof., Doç., Av., Sn., Yrd., örn., No.
ar = د.

[Replacements]
; For all languages, one per line: Recognized = Correct. Whole words, case-insensitive.
; Example: Open AI = OpenAI

[Replacements.de]

[Replacements.en]

[Replacements.tr]

[Replacements.ar]
